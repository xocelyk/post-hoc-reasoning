[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "post-hoc-reasoning"
version = "1.0.0"
description = "Post-hoc reasoning in chain of thought: probing and steering pre-committed answers"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "Kyle Cox" },
  { name = "Darius Kianersi" },
  { name = "Adrià Garriga-Alonso" },
]
requires-python = ">=3.10,<3.13"
dependencies = [
  "torch==2.7.1",
  "transformer-lens==2.16.1",
  "transformers==4.54.0",
  "nnsight==0.4.11",
  "numpy==1.26.2",
  "pandas==2.1.3",
  "scikit-learn==1.5.0",
  "matplotlib==3.8.1",
  "seaborn==0.13.2",
  "einops==0.8.1",
  "openai==1.97.1",
  "pydantic>=2",
  "python-dotenv==0.21.0",
  "PyYAML==6.0.1",
  "tqdm==4.66.5",
  "rich==13.7.1",
  "wandb==0.21.0",
  "plotext>=5",
  "psutil>=5.9",
]

[project.urls]
Repository = "https://github.com/xocelyk/post-hoc-reasoning"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
