cache_dir: cache
datasets:
- name: sports_understanding
  split_seed: 42
  test_size: 800
  train_size: 200
evaluate_confabulation: false
interactive: true
max_concurrent_models: 1
models:
- backend: transformer_lens
  batch_size: 2
  device: auto
  dtype: bfloat16
  name: google/gemma-2-9b-it
save_generations: true
steering:
  alpha_range:
  - 0
  - 2
  - 4
  - 6
  max_new_tokens: 100
  temperature: 0.7
use_cache: true
