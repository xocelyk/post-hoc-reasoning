# Configuration for CAA Layer-Incremental steering method
# Uses incremental layer steering (ILS) approach on sports_understanding dataset

cache_dir: cache
evaluate_confabulation: false
interactive: true
max_concurrent_models: 1
save_generations: true
use_cache: true

models:
- name: google/gemma-2-9b-it
  backend: auto
  batch_size: 2
  device: auto
  dtype: bfloat16

datasets:
- name: sports_understanding
  train_size: 100
  test_size: 100
  split_seed: 42

# Layer-incremental steering configuration
steering:
  method: caa-layer-incremental
  alpha_range: [1, 2, 3, 4, 5]
  temperature: 0.7
  max_new_tokens: 100