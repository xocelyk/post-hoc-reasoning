# Configuration for CAA-Single-Layer steering method
# 200 train, 100 test samples with detailed alpha range 0-3 in 0.25 increments

cache_dir: cache
evaluate_confabulation: false
interactive: true
max_concurrent_models: 1
save_generations: true
use_cache: true

models:
- name: google/gemma-2-9b-it
  backend: auto
  batch_size: 2
  device: auto
  dtype: bfloat16

datasets:
- name: sports_understanding
  train_size: 200
  test_size: 100
  split_seed: 42

# CAA Single-Layer steering configuration
steering:
  method: caa-single-layer
  alpha_range: [0, 0.25, 0.5, 0.75, 1.0, 1.25, 1.5, 1.75, 2.0, 2.25, 2.5, 2.75, 3.0]
  temperature: 0.7
  max_new_tokens: 100