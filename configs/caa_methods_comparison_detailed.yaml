# Configuration for comparing both CAA steering methods
# 200 train, 100 test samples with detailed alpha range 0-3 in 0.25 increments
# 
# To test both methods:
# 1. Run with method: caa-single-layer
# 2. Change to method: caa-layer-incremental and run again
# 
# This allows direct comparison since all other parameters are identical

cache_dir: cache
evaluate_confabulation: false
interactive: true
max_concurrent_models: 1
save_generations: true
use_cache: true

models:
- name: google/gemma-2-9b-it
  backend: auto
  batch_size: 2
  device: auto
  dtype: bfloat16

datasets:
- name: sports_understanding
  train_size: 200
  test_size: 100
  split_seed: 42

# CAA steering configuration - switch method between runs
steering:
  method: caa-single-layer  # Change to: caa-layer-incremental for second run
  alpha_range: [0, 0.25, 0.5, 0.75, 1.0, 1.25, 1.5, 1.75, 2.0, 2.25, 2.5, 2.75, 3.0]
  temperature: 0.7
  max_new_tokens: 100

# Instructions for running both methods:
# 
# Method 1 - CAA Single Layer:
# python run_experiments.py configs/caa_methods_comparison_detailed.yaml
# 
# Method 2 - CAA Layer Incremental:
# Edit this file: change "method: caa-single-layer" to "method: caa-layer-incremental"
# python run_experiments.py configs/caa_methods_comparison_detailed.yaml
#
# Both experiments will use the same:
# - Dataset and split (sports_understanding, 200/100, seed=42)
# - Model (gemma-2-9b-it)
# - Alpha range (0-3 in 0.25 increments)
# - Generation parameters (temp=0.7, max_tokens=100)
#
# Results can then be directly compared between the two methods