# Configuration for automatically comparing both CAA steering methods
# 200 train, 100 test samples with detailed alpha range 0-3 in 0.25 increments
# 
# This config automatically tests both CAA methods in a single run
# Each method gets its own separate experiment with independent caching

cache_dir: cache
evaluate_confabulation: false
interactive: true
max_concurrent_models: 1
save_generations: true
use_cache: true

models:
- name: google/gemma-2-9b-it
  backend: auto
  batch_size: 2
  device: auto
  dtype: bfloat16

datasets:
- name: sports_understanding
  train_size: 200
  test_size: 100
  split_seed: 42

# CAA steering configuration - automatically scans both methods
steering:
  methods_to_scan: ["caa-single-layer", "caa-layer-incremental"]
  alpha_range: [0, 0.25, 0.5, 0.75, 1.0, 1.25, 1.5, 1.75, 2.0, 2.25, 2.5, 2.75, 3.0]
  temperature: 0.7
  max_new_tokens: 100

# Usage:
# python run_experiments.py configs/caa_methods_comparison_detailed.yaml
#
# This will automatically run both methods:
# - CAA Single Layer: Raw difference vectors, best layer selection
# - CAA Layer Incremental: Incremental differences with RMS normalization
#
# Both experiments use identical parameters:
# - Dataset and split (sports_understanding, 200/100, seed=42)
# - Model (gemma-2-9b-it)
# - Alpha range (0-3 in 0.25 increments, 13 values total)
# - Generation parameters (temp=0.7, max_tokens=100)
#
# Each method gets independent caching to avoid conflicts
# Results can be directly compared between the two methods