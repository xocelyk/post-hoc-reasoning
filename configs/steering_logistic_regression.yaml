# Configuration for Logistic Regression steering method
# Uses trained classifiers on all layers (original approach)

cache_dir: cache
evaluate_confabulation: false
interactive: true
max_concurrent_models: 1
save_generations: true
use_cache: true

models:
- name: google/gemma-2-9b-it
  backend: auto
  batch_size: 2
  device: auto
  dtype: bfloat16

datasets:
- name: sports_understanding
  train_size: 100
  test_size: 100
  split_seed: 42

# Logistic regression steering configuration
steering:
  method: logistic-regression
  alpha_range: [1, 2, 3, 4, 5]
  temperature: 0.7
  max_new_tokens: 100