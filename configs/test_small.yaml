# Small test configuration for validation
models:
  - name: "gpt2"  # Small model for testing
    backend: "auto"
    device: "cpu"  # Use CPU to avoid CUDA issues
    dtype: "float32"
    batch_size: 1

datasets:
  - name: "sports_understanding"
    train_size: 5    # Very small for testing
    test_size: 10    # Very small for testing
    split_seed: 42

steering:
  alpha_range: [0, 1]  # Just test two values
  temperature: 0.7
  max_new_tokens: 20   # Short generations

# Runtime settings
cache_dir: "test_cache"
use_cache: true
interactive: false
max_concurrent_models: 1
save_generations: true