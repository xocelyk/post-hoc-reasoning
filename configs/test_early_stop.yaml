cache_dir: cache
datasets:
- name: anachronisms
  split_seed: 42
  test_size: 5  # Small test size
  train_size: 5  # Small train size

evaluate_confabulation: false
interactive: false
max_concurrent_models: 1
models:
- backend: nnsight
  batch_size: 1
  device: auto
  dtype: bfloat16
  name: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B

save_generations: true
steering:
  alpha_range:
  - 1
  - 3
  - 5
  - 7  # Test a range that might hit unparsed rates
  - 10
  max_new_tokens: 2000
  temperature: 0.7
  method: caa-single-layer
  max_gen: 3  # Limit to 3 examples per direction
  stop_alpha_early: true  # Enable the feature directly in config

use_cache: false  # Disable cache to force regeneration