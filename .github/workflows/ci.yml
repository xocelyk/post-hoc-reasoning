name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install (CPU torch)
        run: uv pip install --extra-index-url https://download.pytorch.org/whl/cpu -e . pytest
      - name: Run smoke tests
        run: uv run pytest -q
